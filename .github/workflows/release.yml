name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Check frontend
        working-directory: frontend
        run: npm run check

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Clean previous bundle artifacts
        run: rm -rf target/release/bundle

      - name: Build Tauri app
        working-directory: crates/slopssh-tauri
        run: |
          for i in 1 2 3; do
            cargo tauri build --config '{"build":{"beforeBuildCommand":""}}' && break
            echo "Build attempt $i failed, retrying..."
            rm -rf ../../target/release/bundle/appimage
            sleep 5
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

      - name: Clean bundles from cache
        if: always()
        run: rm -rf target/release/bundle

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Clean previous bundle artifacts
        shell: bash
        run: rm -rf target/release/bundle

      - name: Build Tauri app
        working-directory: crates/slopssh-tauri
        shell: bash
        run: cargo tauri build --config '{"build":{"beforeBuildCommand":""}}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      - name: Clean bundles from cache
        if: always()
        shell: bash
        run: rm -rf target/release/bundle

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - name: Clean stale release assets on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Checking for stale assets in release ${GITHUB_REF_NAME} (current version: ${VERSION})..."
          STALE_ASSETS=$(gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --json assets --jq -r '.assets[]? | select(.name | contains("'"$VERSION"'") | not) | .name' 2>/dev/null || true)
          for asset in $STALE_ASSETS; do
            if [ -n "$asset" ]; then
              echo "Removing stale asset from release: $asset"
              gh release delete-asset "${GITHUB_REF_NAME}" "$asset" --repo "${{ github.repository }}" --yes || true
            fi
          done

      - name: Filter local artifacts by current version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Ensuring only version ${VERSION} artifacts are uploaded..."
          find artifacts -type f ! -name "*${VERSION}*" -exec echo "Removing stale artifact: {}" \; -exec rm -f {} +
          echo "Artifacts to publish:"
          find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: SlopSSH ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/linux/**/*.deb
            artifacts/linux/**/*.AppImage
            artifacts/windows/**/*.exe
            artifacts/windows/**/*.msi
